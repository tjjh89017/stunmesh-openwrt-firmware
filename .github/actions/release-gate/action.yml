name: Release gate
description: Compare a build fingerprint against the latest Release's version.json (spec §22)

inputs:
  fingerprint:
    description: 'Newly computed build fingerprint'
    required: true
  repo:
    description: 'owner/repo to query for the latest Release'
    required: false
    default: ${{ github.repository }}
  token:
    description: 'GitHub token used to query Releases'
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: '"true" if no prior release exists or its fingerprint differs'
    value: ${{ steps.gate.outputs.changed }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        FINGERPRINT: ${{ inputs.fingerprint }}
      run: |
        set -euo pipefail
        dir="$(mktemp -d)"
        previous=""
        if gh release download --repo "$REPO" --pattern 'version.json' --dir "$dir" >/dev/null 2>&1; then
          previous="$(jq -r '.build_fingerprint // empty' "${dir}/version.json")"
        fi
        if [ -z "$previous" ] || [ "$previous" != "$FINGERPRINT" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
