name: Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'PLAN.md'
      - 'docs/**'
      - 'LICENSE'
      - '.plan/**'
  schedule:
    - cron: '17 22 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  FEED_URL: ${{ (vars.STUNMESH_FEED_URL != '' && vars.STUNMESH_FEED_URL) || 'https://tjjh89017.github.io/stunmesh-openwrt' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.openwrt.outputs.version }}
      series: ${{ steps.config.outputs.series }}
      matrix: ${{ steps.config.outputs.matrix }}
      build_id: ${{ steps.ids.outputs.build_id }}
      timestamp: ${{ steps.ids.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v7

      - name: Load config
        id: config
        uses: ./.github/actions/load-config

      - name: Resolve OpenWrt version
        id: openwrt
        uses: ./.github/actions/resolve-openwrt
        with:
          series: ${{ steps.config.outputs.series }}

      - name: Compute build id
        id: ids
        run: |
          set -euo pipefail
          echo "build_id=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup ImageBuilder
        id: ib
        uses: ./.github/actions/setup-imagebuilder
        with:
          version: ${{ needs.prepare.outputs.version }}
          target: ${{ matrix.target }}
          subtarget: ${{ matrix.subtarget }}
          series: ${{ needs.prepare.outputs.series }}
          feed_url: ${{ env.FEED_URL }}

      - name: Validate profile
        env:
          IB_PATH: ${{ steps.ib.outputs.path }}
          PROFILE: ${{ matrix.profile }}
        run: scripts/check-profile.sh "$IB_PATH" "$PROFILE"

      - name: Prepare package list
        env:
          TARGET_ID: ${{ matrix.id }}
          EXTRA_PACKAGES: ${{ matrix.extra_packages }}
          EXCLUDE_PACKAGES: ${{ matrix.exclude_packages }}
        run: |
          set -euo pipefail
          mkdir -p packages
          scripts/prepare-packages.sh configs/packages.txt "$EXTRA_PACKAGES" "packages/packages-${TARGET_ID}.txt" "$EXCLUDE_PACKAGES"

      - name: Resolve manifest
        env:
          IB_PATH: ${{ steps.ib.outputs.path }}
          PROFILE: ${{ matrix.profile }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p manifests
          scripts/get-manifest.sh "$IB_PATH" "$PROFILE" "packages/packages-${TARGET_ID}.txt" "manifests/manifest-${TARGET_ID}.txt"

      - name: Collect required packages
        id: packages
        env:
          MANIFEST_FILE: manifests/manifest-${{ matrix.id }}.txt
        run: |
          set -euo pipefail
          json="$(scripts/collect-packages.sh "$MANIFEST_FILE" configs/packages.txt)"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Prepare files overlay
        run: |
          cp -r files build-overlay
          find build-overlay -name '.gitkeep' -delete

      - name: Generate firmware metadata
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          OPENWRT_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_ID: ${{ matrix.id }}
          MODEL: ${{ matrix.model }}
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          PROFILE: ${{ matrix.profile }}
          PACKAGES_JSON: ${{ steps.packages.outputs.json }}
        run: |
          set -euo pipefail
          scripts/generate-firmware-metadata.sh \
            build-overlay/etc/firmware-build.json \
            "$BUILD_ID" "$TIMESTAMP" "$OPENWRT_VERSION" \
            "$TARGET_ID" "$MODEL" "$VARIANT" "$TARGET" "$SUBTARGET" "$PROFILE" "$PACKAGES_JSON"

      - name: Build image
        id: build
        env:
          IB_PATH: ${{ steps.ib.outputs.path }}
          PROFILE: ${{ matrix.profile }}
          TARGET_ID: ${{ matrix.id }}
          OPENWRT_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          set -euo pipefail
          image_path="$(scripts/build.sh "$IB_PATH" "$PROFILE" "packages/packages-${TARGET_ID}.txt" build-overlay "$OPENWRT_VERSION" "$BUILD_ID" output)"
          echo "image_path=$image_path" >> "$GITHUB_OUTPUT"

      - name: Verify image
        id: verify
        env:
          IMAGE_PATH: ${{ steps.build.outputs.image_path }}
        run: |
          set -euo pipefail
          sha256="$(scripts/verify-image.sh "$IMAGE_PATH" | awk '{print $1}')"
          size="$(stat -c%s "$IMAGE_PATH")"
          {
            echo "sha256=$sha256"
            echo "size=$size"
            echo "filename=$(basename "$IMAGE_PATH")"
          } >> "$GITHUB_OUTPUT"

      - name: Write result fragment
        env:
          TARGET_ID: ${{ matrix.id }}
          MODEL: ${{ matrix.model }}
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          PROFILE: ${{ matrix.profile }}
          FILENAME: ${{ steps.verify.outputs.filename }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          SIZE: ${{ steps.verify.outputs.size }}
        run: |
          set -euo pipefail
          jq -n \
            --arg id "$TARGET_ID" --arg model "$MODEL" --arg variant "$VARIANT" \
            --arg target "$TARGET" --arg subtarget "$SUBTARGET" --arg profile "$PROFILE" \
            --arg filename "$FILENAME" --arg sha256 "$SHA256" --argjson size "$SIZE" \
            '{id:$id, model:$model, variant:$variant, target:$target, subtarget:$subtarget, profile:$profile, filename:$filename, sha256:$sha256, size:$size}' \
            > "result-${TARGET_ID}.json"

      - name: Stage release assets
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp output/*.bin "result-${TARGET_ID}.json" "manifests/manifest-${TARGET_ID}.txt" release-assets/

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: artifacts
          merge-multiple: true

      - name: Assemble version.json
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          OPENWRT_VERSION: ${{ needs.prepare.outputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          first_id="$(echo "$MATRIX" | jq -r '.include | sort_by(.id) | .[0].id')"
          packages_json="$(scripts/collect-packages.sh "artifacts/manifest-${first_id}.txt" configs/packages.txt)"

          fragments=()
          while IFS= read -r f; do
            fragments+=("$(cat "$f")")
          done < <(find artifacts -maxdepth 1 -name 'result-*.json' | sort)

          scripts/generate-version-json.sh version.json "$BUILD_ID" "$TIMESTAMP" "$OPENWRT_VERSION" "$packages_json" "${fragments[@]}"

      - name: Build sha256sums
        run: (cd artifacts && sha256sum -- *.bin) > sha256sums

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          set -euo pipefail
          tag="firmware-${BUILD_ID}"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            version.json sha256sums artifacts/*.bin artifacts/manifest-*.txt

  prune:
    name: Prune Release
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prune releases (keep newest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | "\(.id)\t\(.tag_name)"' \
            | sort -k1,1 -rn | cut -f2 | { grep -- '^firmware-' || true; } \
            | tail -n +11 | while IFS= read -r tag; do
                echo "I: pruning release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" \
                  --yes --cleanup-tag \
                  || echo "::warning::failed to delete release $tag (continuing)"
              done
